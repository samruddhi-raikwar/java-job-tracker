name: Daily Java Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run job search
        run: python job_search.py

      - name: Save updated tracker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job_tracker.csv
          git diff --cached --quiet || git commit -m "Update Java job tracker"
          git push
